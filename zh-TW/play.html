<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>對局模式 · 旅店手札</title>
<meta name="description" content="边玩边对照：7 格陣容、缺卡清單、本回合建議、置頂小窗。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="旅店手札" />
<meta property="og:title" content="對局模式 · 旅店手札" />
<meta property="og:description" content="7 格陣容 · 缺卡清單 · 本回合建議 · 置頂小窗" />
<meta property="og:image" content="https://nikom-blog.org/og.png" />
<meta property="og:url" content="https://nikom-blog.org/play.html" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="https://nikom-blog.org/play.html" />
<link rel="icon" href="../favicon.png" type="image/png" sizes="64x64" />
<link rel="manifest" href="../manifest.json" />
<meta name="theme-color" content="#21140c" />
<link rel="stylesheet" href="../styles.css?v=20261111e">
<link rel="stylesheet" href="../play.css?v=20261111e">
</head>
<body class="play-body">

<header class="play-top">
  <a class="play-back" href="index.html">← 返回</a>
  <div class="play-comp-wrap">
    <select id="playComp" aria-label="選择陣容"></select>
    <span class="play-tier" id="playTier"></span>
  </div>
  <div class="play-hero-wrap" id="playHeroWrap">
    <button type="button" class="play-hero-btn" id="playHeroBtn" aria-expanded="false">選英雄 ▾</button>
    <button type="button" class="play-hero-clear" id="playHeroClear" hidden title="清除英雄筛選" aria-label="清除英雄筛選">✕</button>
    <div class="play-hero-pop" id="playHeroPop" hidden>
      <input type="search" id="playHeroSearch" placeholder="搜英雄名（支持116位英雄）…" autocomplete="off">
      <div class="play-hero-list" id="playHeroList"></div>
    </div>
  </div>
  <button type="button" class="play-draft-btn" id="btnDraftHelper" title="錄入本局 5 個種族 + 候選英雄，一鍵計算最優開局選将與陣容">🎯 開局 4 選 1</button>
  <span class="play-meta" id="playMeta"></span>
  <a class="lang-fab play-lang" href="../play.html">簡中</a>
</header>

<div class="play-share-banner" id="shareBanner" hidden>
  <span>正在預覽分享的對局快照，尚未覆蓋本地存檔。</span>
  <div class="psb-btns">
    <button type="button" id="btnPromoteShare">保存為我的對局</button>
    <button type="button" id="btnExitShare">回到我上次进度</button>
  </div>
</div>

<div class="play-hero-recs" id="playHeroRecs" hidden></div>

<div class="play-filter-bar" id="playFilterBar" aria-label="筛選與禁選">
  <div class="pfb-chips" id="pfbTribes"></div>
  <button type="button" class="pfb-ban-toggle" id="btnBanMode" title="開啟後点擊種族芯片即可標記為本局已 Ban（禁用）">🚫 標記禁用</button>
  <button type="button" class="pfb-clear" id="btnClearFilters" hidden>重置筛選</button>
</div>

<div class="play-engine-wrap" id="playEngineWrap">
  <div class="play-engine-bar" id="playEngineBar" aria-label="摸到核心直通車"></div>
  <div class="play-engine-res" id="playEngineRes" hidden></div>
</div>

<div class="play-status" id="playStatus">
  <div class="ps"><span>回合</span><button type="button" data-k="turn" data-d="-1">−</button><b id="stTurn">1</b><button type="button" data-k="turn" data-d="1">+</button></div>
  <div class="ps"><span>本數</span><button type="button" data-k="tier" data-d="-1">−</button><b id="stTier">1</b><button type="button" data-k="tier" data-d="1">+</button><button type="button" class="ps-tog" id="btnTripleReady" title="手裡有对子准備三连時点亮，實時計算應该直接碰本还是锁对子升本再碰">🌟 手有对子</button></div>
  <div class="ps"><span>金幣</span><button type="button" data-k="gold" data-d="-1">−</button><b id="stGold">3</b><button type="button" data-k="gold" data-d="1">+</button><button type="button" class="ps-tog on" id="btnAutoGold" title="下回合自動按旅店規則補满上限金幣（T1=3…T8+=10）">自動補幣</button></div>
  <div class="ps"><span>血量</span><button type="button" class="ps-step" data-k="health" data-d="-5">−5</button><button type="button" data-k="health" data-d="-1">−</button><b id="stHealth">30</b><button type="button" data-k="health" data-d="1">+</button><button type="button" class="ps-step" data-k="health" data-d="5">+5</button></div>
  <div class="ps-shortcuts" title="快捷鍵說明">1-7 標卡 · 空格 下回合 · ↑ 升本 · Z 撤回</div>
</div>

<main class="play-main">
  <div class="play-board">
    <section class="play-pipeline-hud" id="playPipelineHud" aria-label="造上萬流水線診斷"></section>
    <div class="play-pos-bar" id="playPosBar" hidden></div>
    <section class="play-slots" id="playSlots" aria-label="七格陣容"></section>
    <div class="play-turn-order" id="playTurnOrder" hidden></div>
    <section class="play-stage-card" id="playStageCard" hidden></section>
  </div>
  <aside class="play-side">
    <div class="play-curve-hud" id="playCurveHud"></div>
    <div class="advice" id="playAdvice">
      <div class="advice-h">本回合建議</div>
      <p class="advice-main" id="adviceMain"></p>
      <p class="advice-sub" id="adviceSub"></p>
    </div>
    <div class="play-counter-box" id="playCounterBox" hidden></div>
    <section class="play-trinket-bar" id="playTrinketBar" aria-label="飾品協同與高勝飾品榜"></section>
    <h3>还差 <b id="missCount">0</b> 張 <span class="miss-legend">（点卡看效果）</span></h3>
    <div id="missList"></div>
    <button type="button" class="play-add" id="btnAdd">＋ 添加 / 对策卡</button>
    <p class="play-hint" id="playHint"></p>
  </aside>
</main>

<footer class="play-actions">
  <button type="button" class="pa-primary" id="btnNext">下一回合 <span>空格</span></button>
  <button type="button" id="btnTierUp">升至 2 本 <span>↑</span></button>
  <button type="button" id="btnUndo" disabled>撤回 <span>Z</span></button>
  <button type="button" id="btnPip">置頂小窗</button>
  <button type="button" id="btnShare">複制鏈接</button>
  <button type="button" id="btnReset">重置</button>
</footer>

<div class="pick-overlay" id="pickOverlay" hidden>
  <div class="pick-box">
    <div class="pick-head">
      <input id="pickInput" type="search" placeholder="搜卡名或關鍵詞，例如：铜須、嘲諷、聖盾術、火車王" autocomplete="off">
      <button type="button" class="pick-restore" id="btnPickRestore" hidden>恢複默認格</button>
    </div>
    <div class="pick-filters" id="pickFilters"></div>
    <div class="pick-list" id="pickList"></div>
    <p class="pick-hint">默認推薦當前可買與常用对策卡 · Esc 關閉</p>
  </div>
</div>

<div class="draft-overlay" id="draftOverlay" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="draft-box">
    <div class="draft-head">
      <div>
        <h3>🎯 開局 4 選 1 · 5 種族秒算助手</h3>
        <p class="draft-sub">錄入本局在場種族與候選英雄，结合分段勝率與未被 Ban 體系直算最佳解</p>
      </div>
      <div class="draft-head-right">
        <div class="draft-mmr" id="draftMmrTabs" role="group" aria-label="分段筛選">
          <button type="button" class="dm-tab on" data-mmr="100">全分段</button>
          <button type="button" class="dm-tab" data-mmr="50">前50%</button>
          <button type="button" class="dm-tab" data-mmr="10">前10%</button>
          <button type="button" class="dm-tab" data-mmr="1">前1%</button>
        </div>
        <button type="button" class="draft-close" id="draftClose" aria-label="關閉">✕</button>
      </div>
    </div>

    <div class="draft-sec">
      <div class="draft-sec-h">
        <b>① 点選本局在場的 5 個種族</b>
        <span class="draft-count" id="draftTribeCount">已選 0 / 5（未選即默認全開放）</span>
        <button type="button" class="draft-mini-btn" id="draftTribeReset">清空重置</button>
      </div>
      <div class="draft-tribes" id="draftTribes"></div>
    </div>

    <div class="draft-sec">
      <div class="draft-sec-h">
        <b>② 選入候選英雄（最多 4 位）</b>
        <span class="draft-count" id="draftHeroCount">已選 0 / 4</span>
        <button type="button" class="draft-mini-btn" id="draftHeroReset">清空英雄</button>
      </div>
      <div class="draft-chosen" id="draftChosen"></div>
      <input type="search" class="draft-search" id="draftHeroSearch" placeholder="搜候選英雄名（如：晨擁、雷矛、鼠王、掛機阿凱）…" autocomplete="off">
      <div class="draft-hero-pool" id="draftHeroPool"></div>
    </div>

    <div class="draft-results" id="draftResults"></div>
  </div>
</div>

<div class="pool-modal" id="globalCardModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pm-card">
    <button type="button" class="pm-close" id="gcmClose" aria-label="關閉">×</button>
    <div class="pm-img" id="gcmImgWrap">
      <img id="gcmImg" alt="" />
      <div class="pm-noimg" id="gcmNoImg" style="display:none;"><i>?</i><span>卡圖收錄中</span></div>
    </div>
    <div class="pm-info">
      <div class="pm-title-row">
        <h3 id="gcmName"></h3>
        <span class="pm-alias" id="gcmAlias" style="display:none;"></span>
      </div>
      <div class="pm-meta" id="gcmMeta"></div>
      <p class="pm-text" id="gcmText"></p>
      <div class="pm-extra" id="gcmExtra"></div>
      <div class="pm-footer">
        <div class="pm-tribes" id="gcmTribes"></div>
        <a class="pm-pool-link" id="gcmPoolLink" href="#" target="_blank" rel="noopener">在完整卡牌池中查看 →</a>
      </div>
    </div>
  </div>
</div>

<script src="data.js?v=20261111e"></script>
<script src="pool.js?v=20261111e"></script>
<script src="stats.js?v=20261111e"></script>
<script src="stats-mmr.js?v=20261111e"></script>
<script src="comp-notes.js?v=20261111e"></script>
<script src="extra-cards.js?v=20261111e"></script>
<script src="cards.js?v=20261111e"></script>
<script src="card-modal.js?v=20261111e"></script>
<script src="play.js?v=20261111e"></script>
<script src="analytics-config.js?v=20261111e"></script>
<script src="analytics.js?v=20261111e"></script>
<script src="history.js?v=20261111e"></script>
<script src="card-fx.js?v=20261111e"></script>
<script>
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
