<meta property="og:title" content="卡牌池查询 · 英雄戰場" />

<meta property="og:url" content="https://nikom-blog.org/cards.html" />

<link rel="icon" href="../favicon.png" type="image/png" sizes="64x64" />

<link rel="stylesheet" href="../styles.css?v=20261103g" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-mark">棋</span><span>旅店手札</span></a>
    <nav class="nav">
      <a href="index.html">手冊</a>
      <a href="cards.html" class="active">卡牌池</a>
      <a href="index.html#start">入門</a>
      <a href="index.html#tribes">種族</a>
      <a href="index.html#meta">週報</a>
    </nav>
    <div class="ver">v37.0</div>
  </div>
</header>

<main class="pool-main">
  <div class="pool-head">
    <div>
      <h1>卡牌池查询</h1>
      <p>收錄 HearthstoneJSON 中全部英雄戰場手下與法術（含歷史卡），共 <b id="poolTotal">0</b> 張。</p>
    </div>
    <a class="btn ghost" href="index.html">← 返回手冊</a>
  </div>

  <div class="pool-controls">
    <input id="poolSearch" class="pool-search" type="search" placeholder="搜索卡名或效果關鍵詞，例如「死亡之聲」「鮮血寶石」「戰吼」" autocomplete="off" />
    <select id="poolTier">
      <option value="">全部等级</option>
      <option value="1">★</option><option value="2">★★</option><option value="3">★★★</option>
      <option value="4">★★★★</option><option value="5">★★★★★</option><option value="6">★★★★★★</option><option value="7">★★★★★★★</option>
    </select>
    <select id="poolRace">
      <option value="">全部種族</option>
      <option value="BEAST">野獸</option><option value="DEMON">惡魔</option><option value="DRAGON">龍</option>
      <option value="ELEMENTAL">元素</option><option value="MECHANICAL">機械</option><option value="MURLOC">魚人</option>
      <option value="NAGA">納迦</option><option value="PIRATE">海盜</option><option value="QUILBOAR">野豬人</option>
      <option value="UNDEAD">不死族</option><option value="ABERRATION">畸變體</option><option value="ALL">全部種族</option>
    </select>
    <select id="poolType">
      <option value="">手下 + 法術</option>
      <option value="minion">只看手下</option>
      <option value="spell">只看法術</option>
    </select>
    <select id="poolSet">
      <option value="">全部版本</option>
      <option value="recent">近两年（BG31+）</option>
      <option value="old">更早</option>
    </select>
  </div>

  <div class="pool-status">
    <span id="poolCount">—</span>
    <button type="button" class="pool-reset" id="poolReset">清空筛選</button>
  </div>

  <div class="pool-grid" id="poolGrid"></div>
  <div class="pool-more"><button type="button" class="btn ghost" id="poolMore">加載更多</button></div>
  <p class="pool-note">卡圖與卡牌數據來自社區卡牌庫（HearthstoneJSON / ZeroToHeroes）。歷史卡不一定出現在當前對局，请以游戲內為准。</p>
</main>

<div class="pool-modal" id="poolModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pm-card">
    <button type="button" class="pm-close" id="pmClose" aria-label="關閉">×</button>
    <div class="pm-img" id="pmImgWrap">
      <img id="pmImg" alt="" />
      <div class="pm-noimg" id="gcmNoImg" style="display:none;"><i>?</i><span>卡圖收錄中</span></div>
    </div>
    <div class="pm-info">
      <div class="pm-title-row">
        <h3 id="pmName"></h3>
        <span class="pm-alias" id="pmAlias" style="display:none;"></span>
      </div>
      <div class="pm-meta" id="pmMeta"></div>
      <p class="pm-text" id="pmText"></p>
      <div class="pm-extra" id="gcmExtra"></div>
      <div class="pm-footer">
        <div class="pm-tribes" id="pmTribes"></div>
      </div>
    </div>
  </div>
</div>

      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
