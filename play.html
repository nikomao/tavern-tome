<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对局模式 · 酒馆手札</title>
<meta name="description" content="边玩边对照：7 格阵容、缺卡清单、本回合建议、置顶小窗。" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="酒馆手札" />
<meta property="og:title" content="对局模式 · 酒馆手札" />
<meta property="og:description" content="7 格阵容 · 缺卡清单 · 本回合建议 · 置顶小窗" />
<meta property="og:image" content="https://nikom-blog.org/og.png" />
<meta property="og:url" content="https://nikom-blog.org/play.html" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="https://nikom-blog.org/play.html" />
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#21140c" />
<script>
  (function(){
    try{
      var sz = localStorage.getItem('tt_font_size');
      if(sz && sz !== 'default'){
        document.documentElement.setAttribute('data-font-size', sz);
      }
    }catch(e){}
  })();
</script>
<link rel="stylesheet" href="styles.css?v=20261114c">
<link rel="stylesheet" href="play.css?v=20261114c">
</head>
<body class="play-body">

<header class="play-top">
  <a class="play-back" href="index.html">← 返回</a>
  <div class="play-comp-wrap">
    <select id="playComp" aria-label="选择阵容"></select>
    <span class="play-tier" id="playTier"></span>
  </div>
  <div class="play-hero-wrap" id="playHeroWrap">
    <button type="button" class="play-hero-btn" id="playHeroBtn" aria-expanded="false">选英雄 ▾</button>
    <button type="button" class="play-hero-clear" id="playHeroClear" hidden title="清除英雄筛选" aria-label="清除英雄筛选">✕</button>
    <div class="play-hero-pop" id="playHeroPop" hidden>
      <input type="search" id="playHeroSearch" placeholder="搜英雄名（支持116位英雄）…" autocomplete="off">
      <div class="play-hero-list" id="playHeroList"></div>
    </div>
  </div>
  <button type="button" class="play-draft-btn" id="btnDraftHelper" title="录入本局 5 个种族 + 候选英雄，一键计算最优开局选将与阵容">🎯 开局 4 选 1</button>
  <div class="font-scale-wrap" id="fontScaleWrap">
    <button type="button" class="font-scale-btn" id="fontScaleBtn" title="调整字号大小" aria-haspopup="dialog" aria-expanded="false">
      <span class="fs-icon">Aa</span>
      <span class="fs-current" id="fsCurrentLabel">字号</span>
    </button>
    <div class="font-scale-pop" id="fontScalePop" hidden>
      <div class="fsp-header">
        <span class="fsp-title">对局字号</span>
        <span class="fsp-val" id="fspCurrentPercent">标准 · 100%</span>
      </div>
      <div class="fsp-stepper">
        <button type="button" class="fsp-step-btn" id="fspStepDec" title="减小字号">A−</button>
        <div class="fsp-scale-pills" id="fspPills">
          <button type="button" class="fsp-pill on" data-size="default">标准</button>
          <button type="button" class="fsp-pill" data-size="medium">中大</button>
          <button type="button" class="fsp-pill" data-size="large">大号</button>
          <button type="button" class="fsp-pill" data-size="huge">超大</button>
        </div>
        <button type="button" class="fsp-step-btn" id="fspStepInc" title="增大字号">A＋</button>
      </div>
      <div class="fsp-hint">边玩边看更轻松，对局与七格阵容同步放大</div>
    </div>
  </div>
  <span class="play-meta" id="playMeta"></span>
  <a class="lang-fab play-lang" href="zh-TW/play.html">繁中</a>
</header>

<div class="play-share-banner" id="shareBanner" hidden>
  <span>正在预览分享的对局快照，尚未覆盖本地存档。</span>
  <div class="psb-btns">
    <button type="button" id="btnPromoteShare">保存为我的对局</button>
    <button type="button" id="btnExitShare">回到我上次进度</button>
  </div>
</div>

<div class="play-hero-recs" id="playHeroRecs" hidden></div>

<div class="play-filter-bar" id="playFilterBar" aria-label="筛选与禁选">
  <div class="pfb-chips" id="pfbTribes"></div>
  <button type="button" class="pfb-ban-toggle" id="btnBanMode" title="开启后点击种族芯片即可标记为本局已 Ban（禁用）">🚫 标记禁用</button>
  <button type="button" class="pfb-clear" id="btnClearFilters" hidden>重置筛选</button>
</div>

<div class="play-engine-wrap" id="playEngineWrap">
  <div class="play-engine-bar" id="playEngineBar" aria-label="摸到核心直通车"></div>
  <div class="play-engine-res" id="playEngineRes" hidden></div>
</div>

<div class="play-status" id="playStatus">
  <div class="ps"><span>回合</span><button type="button" data-k="turn" data-d="-1">−</button><b id="stTurn">1</b><button type="button" data-k="turn" data-d="1">+</button></div>
  <div class="ps"><span>本数</span><button type="button" data-k="tier" data-d="-1">−</button><b id="stTier">1</b><button type="button" data-k="tier" data-d="1">+</button><button type="button" class="ps-tog" id="btnTripleReady" title="手里有对子准备三连时点亮，实时计算应该直接碰本还是锁对子升本再碰">🌟 手有对子</button></div>
  <div class="ps"><span>金币</span><button type="button" data-k="gold" data-d="-1">−</button><b id="stGold">3</b><button type="button" data-k="gold" data-d="1">+</button><button type="button" class="ps-tog on" id="btnAutoGold" title="下回合自动按酒馆规则补满上限金币（T1=3…T8+=10）">自动补币</button></div>
  <div class="ps"><span>血量</span><button type="button" class="ps-step" data-k="health" data-d="-5">−5</button><button type="button" data-k="health" data-d="-1">−</button><b id="stHealth">30</b><button type="button" data-k="health" data-d="1">+</button><button type="button" class="ps-step" data-k="health" data-d="5">+5</button></div>
  <div class="ps-shortcuts" title="快捷键说明">1-7 标卡 · 空格 下回合 · ↑ 升本 · Z 撤回</div>
</div>

<main class="play-main">
  <div class="play-board">
    <section class="play-pipeline-hud" id="playPipelineHud" aria-label="造上万流水线诊断"></section>
    <div class="play-pos-bar" id="playPosBar" hidden></div>
    <section class="play-slots" id="playSlots" aria-label="七格阵容"></section>
    <div class="play-turn-order" id="playTurnOrder" hidden></div>
    <section class="play-stage-card" id="playStageCard" hidden></section>
  </div>
  <aside class="play-side">
    <div class="play-curve-hud" id="playCurveHud"></div>
    <div class="advice" id="playAdvice">
      <div class="advice-h">本回合建议</div>
      <p class="advice-main" id="adviceMain"></p>
      <p class="advice-sub" id="adviceSub"></p>
    </div>
    <div class="play-counter-box" id="playCounterBox" hidden></div>
    <section class="play-trinket-bar" id="playTrinketBar" aria-label="饰品协同与高胜饰品榜"></section>
    <h3>还差 <b id="missCount">0</b> 张 <span class="miss-legend">（点卡看效果）</span></h3>
    <div id="missList"></div>
    <button type="button" class="play-add" id="btnAdd">＋ 添加 / 对策卡</button>
    <p class="play-hint" id="playHint"></p>
  </aside>
</main>

<footer class="play-actions">
  <button type="button" class="pa-primary" id="btnNext">下一回合 <span>空格</span></button>
  <button type="button" id="btnTierUp">升至 2 本 <span>↑</span></button>
  <button type="button" id="btnUndo" disabled>撤回 <span>Z</span></button>
  <button type="button" id="btnPip">置顶小窗</button>
  <button type="button" id="btnShare">复制链接</button>
  <button type="button" id="btnReset">重置</button>
</footer>

<div class="pick-overlay" id="pickOverlay" hidden>
  <div class="pick-box">
    <div class="pick-head">
      <input id="pickInput" type="search" placeholder="搜卡名或关键词，例如：铜须、嘲讽、圣盾、火车王" autocomplete="off">
      <button type="button" class="pick-restore" id="btnPickRestore" hidden>恢复默认格</button>
    </div>
    <div class="pick-filters" id="pickFilters"></div>
    <div class="pick-list" id="pickList"></div>
    <p class="pick-hint">默认推荐当前可买与常用对策卡 · Esc 关闭</p>
  </div>
</div>

<div class="draft-overlay" id="draftOverlay" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="draft-box">
    <div class="draft-head">
      <div>
        <h3>🎯 开局 4 选 1 · 5 种族秒算助手</h3>
        <p class="draft-sub">录入本局在场种族与候选英雄，结合分段胜率与未被 Ban 体系直算最优解</p>
      </div>
      <div class="draft-head-right">
        <div class="draft-mmr" id="draftMmrTabs" role="group" aria-label="分段筛选">
          <button type="button" class="dm-tab on" data-mmr="100">全分段</button>
          <button type="button" class="dm-tab" data-mmr="50">前50%</button>
          <button type="button" class="dm-tab" data-mmr="10">前10%</button>
          <button type="button" class="dm-tab" data-mmr="1">前1%</button>
        </div>
        <button type="button" class="draft-close" id="draftClose" aria-label="关闭">✕</button>
      </div>
    </div>

    <div class="draft-sec">
      <div class="draft-sec-h">
        <b>① 点选本局在场的 5 个种族</b>
        <span class="draft-count" id="draftTribeCount">已选 0 / 5（未选即默认全开放）</span>
        <button type="button" class="draft-mini-btn" id="draftTribeReset">清空重置</button>
      </div>
      <div class="draft-tribes" id="draftTribes"></div>
    </div>

    <div class="draft-sec">
      <div class="draft-sec-h">
        <b>② 选入候选英雄（最多 4 位）</b>
        <span class="draft-count" id="draftHeroCount">已选 0 / 4</span>
        <button type="button" class="draft-mini-btn" id="draftHeroReset">清空英雄</button>
      </div>
      <div class="draft-chosen" id="draftChosen"></div>
      <input type="search" class="draft-search" id="draftHeroSearch" placeholder="搜候选英雄名（如：晨拥、雷矛、鼠王、挂机阿凯）…" autocomplete="off">
      <div class="draft-hero-pool" id="draftHeroPool"></div>
    </div>

    <div class="draft-results" id="draftResults"></div>
  </div>
</div>

<div class="pool-modal" id="globalCardModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pm-card">
    <button type="button" class="pm-close" id="gcmClose" aria-label="关闭">×</button>
    <div class="pm-img" id="gcmImgWrap">
      <img id="gcmImg" alt="" />
      <div class="pm-noimg" id="gcmNoImg" style="display:none;"><i>?</i><span>卡图收录中</span></div>
    </div>
    <div class="pm-info">
      <div class="pm-title-row">
        <h3 id="gcmName"></h3>
        <span class="pm-alias" id="gcmAlias" style="display:none;"></span>
      </div>
      <div class="pm-meta" id="gcmMeta"></div>
      <p class="pm-text" id="gcmText"></p>
      <div class="pm-extra" id="gcmExtra"></div>
      <div class="pm-footer">
        <div class="pm-tribes" id="gcmTribes"></div>
        <a class="pm-pool-link" id="gcmPoolLink" href="#" target="_blank" rel="noopener">在完整卡池中查看 →</a>
      </div>
    </div>
  </div>
</div>

<script src="data.js?v=20261114a"></script>
<script src="pool.js?v=20261114a"></script>
<script src="stats.js?v=20261114a"></script>
<script src="stats-mmr.js?v=20261114a"></script>
<script src="comp-notes.js?v=20261114a"></script>
<script src="extra-cards.js?v=20261114a"></script>
<script src="cards.js?v=20261114c"></script>
<script src="card-modal.js?v=20261114c"></script>
<script src="font-size.js?v=20261114c"></script>
<script src="play.js?v=20261114c"></script>
<script src="analytics-config.js?v=20261114a"></script>
<script src="analytics.js?v=20261114a"></script>
<script src="history.js?v=20261114a"></script>
<script src="card-fx.js?v=20261114a"></script>
<script>
  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
