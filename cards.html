<head>

<meta property="og:url" content="https://nikom-blog.org/cards.html" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="canonical" href="https://nikom-blog.org/cards.html" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#21140c" />
<link rel="stylesheet" href="styles.css?v=20261111b" />
</head>
<body>
<div class="grain" aria-hidden="true"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html"><span class="brand-mark">棋</span><span>酒馆手札</span></a>
    <nav class="nav">
      <a href="index.html">手册</a>
      <a href="cards.html" class="active">卡池</a>
      <a href="index.html#start">入门</a>
      <a href="index.html#tribes">种族</a>
      <a href="index.html#meta">周报</a>
    </nav>
    <div class="ver">v37.0</div>
  </div>
</header>

<main class="pool-main">
  <div class="pool-head">
    <div>
      <h1>卡池查询</h1>
      <p>收录 HearthstoneJSON 中全部酒馆战棋随从与法术（含历史卡），共 <b id="poolTotal">0</b> 张。</p>
    </div>
    <a class="btn ghost" href="index.html">← 返回手册</a>
  </div>

  <div class="pool-controls">
    <input id="poolSearch" class="pool-search" type="search" placeholder="搜索卡名或效果关键词，例如「亡语」「鲜血宝石」「战吼」" autocomplete="off" />
    <select id="poolTier">
      <option value="">全部等级</option>
      <option value="1">★</option><option value="2">★★</option><option value="3">★★★</option>
      <option value="4">★★★★</option><option value="5">★★★★★</option><option value="6">★★★★★★</option><option value="7">★★★★★★★</option>
    </select>
    <select id="poolRace">
      <option value="">全部种族</option>
      <option value="BEAST">野兽</option><option value="DEMON">恶魔</option><option value="DRAGON">龙</option>
      <option value="ELEMENTAL">元素</option><option value="MECHANICAL">机械</option><option value="MURLOC">鱼人</option>
      <option value="NAGA">纳迦</option><option value="PIRATE">海盗</option><option value="QUILBOAR">野猪人</option>
      <option value="UNDEAD">亡灵</option><option value="ABERRATION">畸变怪</option><option value="ALL">全种族</option>
    </select>
    <select id="poolType">
      <option value="">随从 + 法术</option>
      <option value="minion">只看随从</option>
      <option value="spell">只看法术</option>
    </select>
    <select id="poolSet">
      <option value="">全部版本</option>
      <option value="recent">近两年（BG31+）</option>
      <option value="old">更早</option>
    </select>
  </div>

  <div class="pool-status">
    <span id="poolCount">—</span>
    <button type="button" class="pool-reset" id="poolReset">清空筛选</button>
  </div>

  <div class="pool-grid" id="poolGrid"></div>
  <div class="pool-more"><button type="button" class="btn ghost" id="poolMore">加载更多</button></div>
  <p class="pool-note">卡图与卡牌数据来自社区卡牌库（HearthstoneJSON / ZeroToHeroes）。历史卡不一定出现在当前对局，请以游戏内为准。</p>
</main>

<div class="pool-modal" id="poolModal" hidden aria-hidden="true" role="dialog" aria-modal="true">
  <div class="pm-card">
    <button type="button" class="pm-close" id="pmClose" aria-label="关闭">×</button>
    <div class="pm-img" id="pmImgWrap">
      <img id="pmImg" alt="" />
      <div class="pm-noimg" id="gcmNoImg" style="display:none;"><i>?</i><span>卡图收录中</span></div>
    </div>
    <div class="pm-info">
      <div class="pm-title-row">
        <h3 id="pmName"></h3>
        <span class="pm-alias" id="pmAlias" style="display:none;"></span>
      </div>
      <div class="pm-meta" id="pmMeta"></div>
      <p class="pm-text" id="pmText"></p>
      <div class="pm-extra" id="gcmExtra"></div>
      <div class="pm-footer">
        <div class="pm-tribes" id="pmTribes"></div>
      </div>
    </div>
  </div>
</div>

<script src="pool.js?v=20261111b"></script>
<script src="comp-notes.js?v=20261111b"></script>

    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
</script>
</body>
</html>
